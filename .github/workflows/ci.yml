name: NetPlan CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run automated tests
        run: python -m pytest -v
      - name: Verify real HTTP startup
        run: python scripts/smoke.py
      - name: Package tracked source files
        run: git archive --format=zip --output=netplan-source.zip HEAD
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: netplan-source
          path: netplan-source.zip
          if-no-files-found: error
          retention-days: 30
